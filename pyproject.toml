[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "q1-t1-mount-riding-skill"
version = "0.1.0"
description = "Reproducible Q1/T1 mount-and-ride MuJoCo skill."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.13"
dependencies = [
  "mujoco==3.16.0",
  "numpy>=1.26,<3",
  "Pillow>=10",
  "torch>=2.1,<3",
  "imageio-ffmpeg>=0.5"
]

[tool.setuptools.packages.find]
include = ["skill*"]
